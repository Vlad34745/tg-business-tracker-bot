name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run test suite with coverage
        run: pytest tests/ -v --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=35

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Check for syntax/import errors (pyflakes)
        run: |
          pip install pyflakes
          # F401 (imported but unused) is expected in core/handlers/__init__.py,
          # where every submodule import is a deliberate side effect (it
          # registers that module's handlers on the shared router) rather
          # than a name the file itself uses — see the # noqa: F401 comments
          # there. Everything else must be clean.
          pyflakes core/*.py core/handlers/*.py core/storage/*.py | grep -v "imported but unused" > /tmp/pyflakes_output.txt || true
          if [ -s /tmp/pyflakes_output.txt ]; then
            cat /tmp/pyflakes_output.txt
            exit 1
          fi
